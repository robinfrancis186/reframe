<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
  <title>Reframe</title>
  <style>
    :root { color-scheme: dark light }
    body { margin:0; font:16px/1.6 system-ui; background:light-dark(#f7f6f2,#191919); color:light-dark(#242424,#f2f0eb); padding:12vh 10vw }
    main { max-width:600px; margin:auto }
    .wordmark { font:26px Georgia,serif; margin-bottom:52px }
    h1 { font:clamp(32px,6vw,48px)/1.1 Georgia,serif; letter-spacing:-.03em }
    p { opacity:.75; overflow-wrap:anywhere }
    button { font:inherit; color:inherit; background:transparent; border:1px solid #777; border-radius:10px; padding:10px 18px; cursor:pointer; margin:8px 8px 0 0 }
    button:focus-visible { outline:3px solid #7ba9f2; outline-offset:3px }
    button:disabled { opacity:.5; cursor:wait }
    [hidden] { display:none }
  </style>
  <main>
    <div class="wordmark">{ } &nbsp; Reframe</div>
    <h1 id="heading">Opening your workspace.</h1>
    <p id="status" role="status">Starting the local engine. Your Library stays on this Mac.</p>
    <p id="detail">The first launch from a disk image can take a little longer.</p>
    <div id="actions" hidden>
      <button id="retry">Try again</button>
      <button id="log">Open diagnostic log</button>
    </div>
  </main>
  <script src="recovery.js"></script>
</html>
